name: Cloud Media Studio

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-media-studio
  cancel-in-progress: true

jobs:
  studio:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    env:
      STUDIO_TOKEN: ${{ secrets.STUDIO_TOKEN }}
      VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
      STUDIO_DIR: ${{ github.workspace }}/cloud-media-studio

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail

          [ -n "$STUDIO_TOKEN" ] || {
            echo "::error::STUDIO_TOKEN is missing"
            exit 1
          }

          [ -n "$VNC_PASSWORD" ] || {
            echo "::error::VNC_PASSWORD is missing"
            exit 1
          }

          [ "${#VNC_PASSWORD}" -le 8 ] || {
            echo "::error::VNC_PASSWORD must be at most 8 characters"
            exit 1
          }

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            python3 \
            ffmpeg \
            curl \
            wget \
            unzip \
            zip \
            xvfb \
            x11vnc \
            fluxbox \
            websockify \
            novnc \
            dbus-x11 \
            wmctrl \
            x11-utils \
            x11-xserver-utils \
            ca-certificates \
            jq

      - name: Install Firefox
        shell: bash
        run: |
          set -euo pipefail
          sudo snap install firefox
          firefox --version

      - name: Install Cloudflare
        shell: bash
        run: |
          set -euo pipefail

          ARCH="$(dpkg --print-architecture)"

          case "$ARCH" in
            amd64) CF_ARCH=amd64 ;;
            arm64) CF_ARCH=arm64 ;;
            *)
              echo "::error::Unsupported architecture"
              exit 1
              ;;
          esac

          wget -q \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-${CF_ARCH}" \
            -O /tmp/cloudflared

          chmod +x /tmp/cloudflared
          sudo install /tmp/cloudflared /usr/local/bin/cloudflared

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            "$STUDIO_DIR/Downloads" \
            "$STUDIO_DIR/Output" \
            "$STUDIO_DIR/profile" \
            "$STUDIO_DIR/temp-links"

          chmod 700 "$STUDIO_DIR"
          chmod 700 "$STUDIO_DIR/temp-links"

      - name: Configure uBlock Origin
        shell: bash
        run: |
          set -euo pipefail

          sudo mkdir -p /etc/firefox/policies

          sudo tee /etc/firefox/policies/policies.json >/dev/null <<'EOF'
          {
            "policies": {
              "ExtensionSettings": {
                "uBlock0@raymondhill.net": {
                  "installation_mode": "force_installed",
                  "install_url": "https://addons.mozilla.org/firefox/downloads/latest/ublock-origin/latest.xpi"
                }
              }
            }
          }
          EOF

      - name: Create media server
        shell: bash
        run: |
          set -euo pipefail

          cat > "$STUDIO_DIR/server.py" <<'PY'
          import os
          import re
          import json
          import time
          import uuid
          import shutil
          import zipfile
          import mimetypes
          import threading
          import subprocess

          from pathlib import Path
          from urllib.parse import unquote
          from http.server import ThreadingHTTPServer, BaseHTTPRequestHandler

          BASE = Path(os.environ["STUDIO_DIR"]).resolve()
          DOWNLOADS = BASE / "Downloads"
          OUTPUT = BASE / "Output"
          LINKS = BASE / "temp-links"

          TOKEN = os.environ["STUDIO_TOKEN"]
          LINK_TTL = 1800

          for folder in (DOWNLOADS, OUTPUT, LINKS):
              folder.mkdir(parents=True, exist_ok=True)

          active_links = {}
          lock = threading.Lock()

          def safe_name(value):
              value = Path(unquote(str(value))).name
              value = re.sub(r'[^a-zA-Z0-9._ -]', '_', value)
              return value.strip(" .")[:180] or "file"

          def get_file(name):
              name = safe_name(name)

              for folder in (DOWNLOADS, OUTPUT):
                  path = folder / name

                  if path.is_file():
                      return path

              return None

          def cleanup_links():
              now = time.time()

              with lock:
                  expired = [
                      key for key, value in active_links.items()
                      if value["expires"] < now
                  ]

                  for key in expired:
                      item = active_links.pop(key)

                      try:
                          item["path"].unlink(missing_ok=True)
                      except OSError:
                          pass

          class Handler(BaseHTTPRequestHandler):

              server_version = "CloudMediaStudio/2.0"

              def log_message(self, fmt, *args):
                  print("[HTTP]", fmt % args)

              def send_json(self, data, status=200):
                  body = json.dumps(data).encode()

                  self.send_response(status)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.send_header("Cache-Control", "no-store")
                  self.end_headers()
                  self.wfile.write(body)

              def authorized(self):
                  return self.headers.get("Authorization", "") == (
                      "Bearer " + TOKEN
                  )

              def require_auth(self):
                  if not self.authorized():
                      self.send_json({"error": "Unauthorized"}, 401)
                      return False

                  return True

              def read_json(self):
                  length = int(self.headers.get("Content-Length", "0"))

                  if not 1 <= length <= 1024 * 1024:
                      raise ValueError("Invalid request size")

                  return json.loads(self.rfile.read(length))

              def do_GET(self):
                  cleanup_links()

                  if self.path == "/":
                      self.dashboard()
                      return

                  if self.path.startswith("/d/"):
                      self.temporary_download(self.path[3:])
                      return

                  if not self.require_auth():
                      return

                  if self.path == "/api/status":
                      self.send_json({
                          "online": True,
                          "ffmpeg": shutil.which("ffmpeg") is not None
                      })
                      return

                  if self.path == "/api/files":
                      files = []

                      for folder in (DOWNLOADS, OUTPUT):
                          for item in folder.iterdir():
                              if item.is_file() and not item.name.endswith(".part"):
                                  try:
                                      files.append({
                                          "name": item.name,
                                          "folder": folder.name,
                                          "size": item.stat().st_size
                                      })
                                  except OSError:
                                      pass

                      self.send_json({"files": files})
                      return

                  self.send_json({"error": "Not found"}, 404)

              def do_POST(self):
                  if not self.require_auth():
                      return

                  try:
                      if self.path == "/api/upload":
                          self.upload()
                      elif self.path == "/api/process":
                          self.process()
                      elif self.path == "/api/link":
                          self.create_link()
                      elif self.path == "/api/zip":
                          self.create_zip()
                      else:
                          self.send_json({"error": "Not found"}, 404)

                  except ValueError as exc:
                      self.send_json({"error": str(exc)}, 400)
                  except Exception as exc:
                      print("[ERROR]", repr(exc))
                      self.send_json({"error": "Operation failed"}, 500)

              def upload(self):
                  name = safe_name(self.headers.get("X-Filename", "upload.bin"))
                  length = int(self.headers.get("Content-Length", "0"))

                  if not 1 <= length <= 1024 * 1024 * 1024:
                      raise ValueError("Invalid upload size")

                  destination = DOWNLOADS / name

                  with destination.open("wb") as output:
                      remaining = length

                      while remaining:
                          chunk = self.rfile.read(min(1024 * 1024, remaining))

                          if not chunk:
                              raise ValueError("Incomplete upload")

                          output.write(chunk)
                          remaining -= len(chunk)

                  self.send_json({
                      "success": True,
                      "name": name,
                      "size": destination.stat().st_size
                  })

              def process(self):
                  data = self.read_json()
                  source = get_file(data.get("file", ""))
                  action = data.get("action", "")

                  if not source:
                      raise ValueError("File not found")

                  name = safe_name(data.get("output", source.stem))

                  if action == "audio_mp3":
                      destination = OUTPUT / (name + ".mp3")
                      command = [
                          "ffmpeg", "-y", "-i", str(source),
                          "-vn", "-codec:a", "libmp3lame",
                          "-q:a", "2", str(destination)
                      ]

                  elif action == "compress_video":
                      destination = OUTPUT / (name + ".mp4")
                      command = [
                          "ffmpeg", "-y", "-i", str(source),
                          "-c:v", "libx264",
                          "-preset", "medium",
                          "-crf", "28",
                          "-c:a", "aac",
                          "-b:a", "128k",
                          str(destination)
                      ]

                  elif action == "thumbnail":
                      destination = OUTPUT / (name + ".jpg")
                      command = [
                          "ffmpeg", "-y", "-ss", "00:00:03",
                          "-i", str(source),
                          "-frames:v", "1",
                          "-q:v", "2", str(destination)
                      ]

                  else:
                      raise ValueError("Unknown processing operation")

                  result = subprocess.run(
                      command,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      text=True,
                      timeout=1800
                  )

                  if result.returncode != 0 or not destination.exists():
                      print(result.stderr[-4000:])
                      raise ValueError("FFmpeg processing failed")

                  self.send_json({
                      "success": True,
                      "output": destination.name
                  })

              def create_zip(self):
                  data = self.read_json()
                  names = data.get("files", [])

                  if not isinstance(names, list) or not names or len(names) > 100:
                      raise ValueError("Invalid file list")

                  archive_name = safe_name(data.get("name", "archive"))

                  if not archive_name.endswith(".zip"):
                      archive_name += ".zip"

                  destination = OUTPUT / archive_name

                  with zipfile.ZipFile(
                      destination, "w", zipfile.ZIP_DEFLATED
                  ) as archive:
                      for name in names:
                          source = get_file(name)

                          if source:
                              archive.write(source, source.name)

                  self.send_json({
                      "success": True,
                      "output": destination.name
                  })

              def create_link(self):
                  data = self.read_json()
                  source = get_file(data.get("file", ""))

                  if not source:
                      raise ValueError("File not found")

                  token = uuid.uuid4().hex
                  copy_path = LINKS / token

                  shutil.copy2(source, copy_path)

                  with lock:
                      active_links[token] = {
                          "path": copy_path,
                          "name": source.name,
                          "expires": time.time() + LINK_TTL
                      }

                  self.send_json({
                      "success": True,
                      "url": "/d/" + token,
                      "expires_in": LINK_TTL
                  })

              def temporary_download(self, token):
                  if not re.fullmatch(r"[a-f0-9]{32}", token):
                      self.send_error(404)
                      return

                  with lock:
                      item = active_links.get(token)

                  if not item or item["expires"] < time.time():
                      self.send_error(404)
                      return

                  path = item["path"]

                  if not path.is_file():
                      self.send_error(404)
                      return

                  self.send_response(200)
                  self.send_header(
                      "Content-Type",
                      mimetypes.guess_type(item["name"])[0]
                      or "application/octet-stream"
                  )
                  self.send_header(
                      "Content-Disposition",
                      'attachment; filename="' + safe_name(item["name"]) + '"'
                  )
                  self.send_header("Content-Length", str(path.stat().st_size))
                  self.end_headers()

                  with path.open("rb") as source:
                      shutil.copyfileobj(source, self.wfile)

              def dashboard(self):
                  body = PAGE.encode()

                  self.send_response(200)
                  self.send_header("Content-Type", "text/html; charset=utf-8")
                  self.send_header("Content-Length", str(len(body)))
                  self.send_header("Cache-Control", "no-store")
                  self.end_headers()
                  self.wfile.write(body)

          PAGE = r"""
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Cloud Media Studio</title>
          <style>
          *{box-sizing:border-box}
          body{margin:0;background:#0b1020;color:#e7edff;font-family:Arial,sans-serif}
          header{padding:22px 5%;background:#111a31;border-bottom:1px solid #263452}
          header h1{margin:0;font-size:24px}
          header p{color:#91a3c5}
          main{max-width:1150px;margin:28px auto;padding:0 18px}
          .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
          .card{background:#121c33;border:1px solid #263452;border-radius:14px;padding:20px}
          h2{font-size:18px;margin-top:0}
          button{border:0;background:#4269ed;color:white;padding:11px 15px;border-radius:8px;cursor:pointer}
          button:hover{background:#5c7df5}
          input,select{width:100%;padding:11px;margin:7px 0 13px;background:#0b1428;color:white;border:1px solid #334466;border-radius:8px}
          .muted{color:#94a6c7;font-size:13px}
          .status{padding:12px;background:#0b1428;border-radius:9px}
          .files{margin-top:20px}
          .file{display:flex;justify-content:space-between;gap:10px;padding:12px;border-bottom:1px solid #263452;align-items:center;flex-wrap:wrap}
          #message{margin-top:18px;white-space:pre-wrap;color:#9db8ff}
          </style>
          </head>
          <body>
          <header>
            <h1>Cloud Media Studio</h1>
            <p>Remote workstation · File manager · FFmpeg</p>
          </header>

          <main>
            <div class="grid">
              <section class="card">
                <h2>Upload files</h2>
                <input id="upload" type="file" multiple>
                <button onclick="uploadFiles()">Upload</button>
                <p class="muted">Files go to Downloads.</p>
              </section>

              <section class="card">
                <h2>Media tools</h2>
                <select id="processFile"></select>
                <select id="action">
                  <option value="compress_video">Compress video to MP4</option>
                  <option value="audio_mp3">Extract audio to MP3</option>
                  <option value="thumbnail">Create thumbnail</option>
                </select>
                <input id="outputName" placeholder="Output filename">
                <button onclick="processFile()">Process</button>
              </section>

              <section class="card">
                <h2>Session</h2>
                <div class="status" id="status">Connecting...</div>
                <p class="muted">Temporary links expire after 30 minutes.</p>
                <button onclick="refreshFiles()">Refresh</button>
              </section>
            </div>

            <section class="card files">
              <h2>Files</h2>
              <div id="files">Loading...</div>
            </section>

            <div id="message"></div>
          </main>

          <script>
          const message = document.getElementById("message");
          let token = localStorage.getItem("studio_token");

          if (!token) {
            token = prompt("Enter Studio Token");
            if (token) localStorage.setItem("studio_token", token);
          }

          async function api(path, options={}) {
            options.headers = {
              ...(options.headers || {}),
              Authorization: "Bearer " + token
            };

            const response = await fetch(path, options);

            if (response.status === 401) {
              localStorage.removeItem("studio_token");
              throw new Error("Invalid token. Reload and try again.");
            }

            const data = await response.json();

            if (!response.ok) {
              throw new Error(data.error || "Request failed");
            }

            return data;
          }

          function notify(text) {
            message.textContent = text;
          }

          async function refreshFiles() {
            try {
              const data = await api("/api/files");
              const container = document.getElementById("files");
              const selector = document.getElementById("processFile");

              container.replaceChildren();
              selector.replaceChildren();

              for (const file of data.files) {
                const option = document.createElement("option");
                option.value = file.name;
                option.textContent = file.name + " (" + file.folder + ")";
                selector.appendChild(option);

                const row = document.createElement("div");
                row.className = "file";

                const label = document.createElement("span");
                label.textContent = file.name + " · " +
                  (file.size / 1048576).toFixed(2) + " MB";

                const button = document.createElement("button");
                button.textContent = "Create temporary link";
                button.onclick = () => makeLink(file.name);

                row.append(label, button);
                container.appendChild(row);
              }

              if (!data.files.length) {
                container.textContent = "No files yet.";
              }

            } catch (error) {
              notify(error.message);
            }
          }

          async function uploadFiles() {
            const files = document.getElementById("upload").files;

            for (const file of files) {
              try {
                notify("Uploading " + file.name);

                await api("/api/upload", {
                  method: "POST",
                  headers: {
                    "X-Filename": encodeURIComponent(file.name),
                    "Content-Type": "application/octet-stream"
                  },
                  body: file
                });

              } catch (error) {
                notify(error.message);
                return;
              }
            }

            notify("Upload complete.");
            refreshFiles();
          }

          async function processFile() {
            try {
              const result = await api("/api/process", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                  file: document.getElementById("processFile").value,
                  action: document.getElementById("action").value,
                  output: document.getElementById("outputName").value
                })
              });

              notify("Finished: " + result.output);
              refreshFiles();

            } catch (error) {
              notify(error.message);
            }
          }

          async function makeLink(name) {
            try {
              const result = await api("/api/link", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({file:name})
              });

              const url = location.origin + result.url;

              try {
                await navigator.clipboard.writeText(url);
                notify("Link copied: " + url);
              } catch {
                notify("Temporary link: " + url);
              }

            } catch (error) {
              notify(error.message);
            }
          }

          async function updateStatus() {
            try {
              const data = await api("/api/status");
              document.getElementById("status").textContent =
                "Online · FFmpeg: " + (data.ffmpeg ? "Available" : "Missing");
            } catch (error) {
              document.getElementById("status").textContent = error.message;
            }
          }

          refreshFiles();
          updateStatus();
          setInterval(refreshFiles, 15000);
          setInterval(updateStatus, 30000);
          </script>
          </body>
          </html>
          """

          if __name__ == "__main__":
              print("[Studio] Listening on port 8080", flush=True)
              ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
          PY

      - name: Start Linux desktop
        shell: bash
        run: |
          set -euo pipefail

          export DISPLAY=:99

          Xvfb :99 \
            -screen 0 1366x768x24 \
            -ac \
            +extension RANDR \
            > /tmp/xvfb.log 2>&1 &

          for i in $(seq 1 30); do
            xdpyinfo -display :99 >/dev/null 2>&1 && break
            sleep 1
          done

          xdpyinfo -display :99 >/dev/null

          fluxbox > /tmp/fluxbox.log 2>&1 &

          sleep 2

          xset s off
          xset -dpms
          xset s noblank
          xsetroot -solid "#101827"

          x11vnc -storepasswd "$VNC_PASSWORD" /tmp/vnc.pass
          chmod 600 /tmp/vnc.pass

          x11vnc \
            -display :99 \
            -forever \
            -shared \
            -rfbauth /tmp/vnc.pass \
            -rfbport 5900 \
            -localhost \
            -noxdamage \
            -repeat \
            > /tmp/x11vnc.log 2>&1 &

          for i in $(seq 1 30); do
            ss -lnt | grep -q ':5900' && break
            sleep 1
          done

          ss -lnt | grep ':5900'

      - name: Start noVNC
        shell: bash
        run: |
          set -euo pipefail

          websockify \
            --web=/usr/share/novnc \
            6080 localhost:5900 \
            > /tmp/novnc.log 2>&1 &

          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:6080/vnc.html >/dev/null && break
            sleep 1
          done

          curl -fsS http://127.0.0.1:6080/vnc.html >/dev/null

      - name: Start dashboard
        shell: bash
        run: |
          set -euo pipefail

          python3 "$STUDIO_DIR/server.py" > /tmp/studio.log 2>&1 &

          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/ >/dev/null && break
            sleep 1
          done

          curl -fsS http://127.0.0.1:8080/ >/dev/null

      - name: Start normal Firefox
        shell: bash
        run: |
          set -euo pipefail

          export DISPLAY=:99
          export MOZ_ENABLE_WAYLAND=0

          cat > "$STUDIO_DIR/profile/user.js" <<EOF
          user_pref("browser.download.folderList", 2);
          user_pref("browser.download.dir", "$STUDIO_DIR/Downloads");
          user_pref("browser.download.useDownloadDir", true);
          user_pref("browser.shell.checkDefaultBrowser", false);
          user_pref("browser.startup.homepage", "https://www.google.com");
          EOF

          firefox \
            --no-remote \
            --profile "$STUDIO_DIR/profile" \
            --new-window \
            https://www.google.com \
            > /tmp/firefox.log 2>&1 &

          for i in $(seq 1 40); do
            wmctrl -l | grep -qi "Mozilla Firefox" && break
            sleep 2
          done

          # Maximize the actual Firefox window, not whichever window is active.
          wmctrl -r "Mozilla Firefox" \
            -b add,maximized_vert,maximized_horz || true

          echo "Firefox window list:"
          wmctrl -l

      - name: Start Cloudflare tunnels
        shell: bash
        run: |
          set -euo pipefail

          cloudflared tunnel \
            --url http://127.0.0.1:8080 \
            --no-autoupdate \
            > /tmp/cloudflared-dashboard.log 2>&1 &

          cloudflared tunnel \
            --url http://127.0.0.1:6080 \
            --no-autoupdate \
            > /tmp/cloudflared-browser.log 2>&1 &

          DASHBOARD_URL=""
          BROWSER_URL=""

          for i in $(seq 1 90); do
            DASHBOARD_URL="$(
              grep -Eo 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' \
                /tmp/cloudflared-dashboard.log | head -n 1 || true
            )"

            BROWSER_URL="$(
              grep -Eo 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' \
                /tmp/cloudflared-browser.log | head -n 1 || true
            )"

            if [ -n "$DASHBOARD_URL" ] && [ -n "$BROWSER_URL" ]; then
              break
            fi

            sleep 2
          done

          if [ -z "$DASHBOARD_URL" ] || [ -z "$BROWSER_URL" ]; then
            echo "::error::Cloudflare tunnel startup failed"
            tail -n 60 /tmp/cloudflared-dashboard.log
            tail -n 60 /tmp/cloudflared-browser.log
            exit 1
          fi

          echo "===================================="
          echo "CLOUD MEDIA STUDIO"
          echo "===================================="
          echo "Dashboard: $DASHBOARD_URL"
          echo "Remote Desktop: ${BROWSER_URL}/vnc.html?resize=scale"
          echo "Display resolution: 1366x768"
          echo "===================================="

      - name: Keep session alive
        shell: bash
        run: |
          set -euo pipefail

          for i in $(seq 1 240); do

            if ! pgrep -f '[s]erver.py' >/dev/null; then
              echo "::error::Dashboard server stopped"
              tail -n 100 /tmp/studio.log || true
              exit 1
            fi

            if ! pgrep -f '[c]loudflared tunnel' >/dev/null; then
              echo "::error::Cloudflare tunnel stopped"
              exit 1
            fi

            sleep 60
          done

      - name: Diagnostics
        if: always()
        shell: bash
        run: |
          echo "========== STUDIO =========="
          tail -n 80 /tmp/studio.log 2>/dev/null || true

          echo "========== FIREFOX =========="
          tail -n 60 /tmp/firefox.log 2>/dev/null || true

          echo "========== VNC =========="
          tail -n 60 /tmp/x11vnc.log 2>/dev/null || true

          echo "========== NOVNC =========="
          tail -n 40 /tmp/novnc.log 2>/dev/null || true

          echo "========== FLUXBOX =========="
          tail -n 40 /tmp/fluxbox.log 2>/dev/null || true

          echo "========== CLOUDFLARE =========="
          tail -n 40 /tmp/cloudflared-dashboard.log 2>/dev/null || true
          tail -n 40 /tmp/cloudflared-browser.log 2>/dev/null || true

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          pkill -f '[c]loudflared' || true
          pkill -f '[s]erver.py' || true
          pkill -f '[w]ebsockify' || true
          pkill -f '[x]11vnc' || true
          pkill -f '[f]irefox' || true
          pkill -f '[f]luxbox' || true
          pkill -f '[X]vfb' || true

          rm -f /tmp/vnc.pass
