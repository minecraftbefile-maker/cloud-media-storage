name: Cloud Media Studio

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-media-studio
  cancel-in-progress: true

jobs:
  studio:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Install system dependencies
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            python3 ffmpeg curl wget unzip zip \
            xvfb x11vnc fluxbox \
            websockify novnc \
            dbus-x11 ca-certificates

          sudo snap install firefox

      - name: Create Cloud Media Studio
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/cloud-media-studio"
          cd "$GITHUB_WORKSPACE/cloud-media-studio"

          mkdir -p Downloads outputs profile scripts

          cat > server.py <<'PY'
          import os
          import re
          import json
          import time
          import uuid
          import shutil
          import zipfile
          import secrets
          import threading
          import subprocess
          from pathlib import Path
          from http.server import ThreadingHTTPServer, BaseHTTPRequestHandler
          from urllib.parse import unquote

          ROOT = Path(__file__).resolve().parent
          DOWNLOADS = ROOT / "Downloads"
          OUTPUTS = ROOT / "outputs"
          WEB = ROOT / "index.html"

          ACCESS_TOKEN = os.environ["STUDIO_TOKEN"]
          LINK_TTL = 30 * 60

          links = {}
          lock = threading.Lock()

          for folder in (DOWNLOADS, OUTPUTS):
              folder.mkdir(exist_ok=True)

          def safe_file(name):
              name = Path(unquote(name)).name
              if not name or name in (".", ".."):
                  raise ValueError("Invalid filename")
              return name

          def find_file(name):
              name = safe_file(name)
              for folder in (DOWNLOADS, OUTPUTS):
                  candidate = folder / name
                  if candidate.is_file():
                      return candidate
              raise FileNotFoundError(name)

          def cleanup():
              while True:
                  now = time.time()
                  with lock:
                      expired = [
                          token for token, item in links.items()
                          if item["expires"] <= now
                      ]
                      for token in expired:
                          item = links.pop(token)
                          try:
                              item["path"].unlink(missing_ok=True)
                          except OSError:
                              pass
                  time.sleep(15)

          def issue_link(path):
              token = secrets.token_urlsafe(32)
              with lock:
                  links[token] = {
                      "path": path,
                      "expires": time.time() + LINK_TTL
                  }
              return "/d/" + token

          def run_ffmpeg(args):
              result = subprocess.run(
                  ["ffmpeg", "-hide_banner", "-y"] + args,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  timeout=1800
              )
              if result.returncode != 0:
                  raise RuntimeError(result.stderr[-1800:])
              return result

          class Handler(BaseHTTPRequestHandler):
              server_version = "CloudMediaStudio/1.0"

              def log_message(self, fmt, *args):
                  print("[HTTP]", fmt % args)

              def send_json(self, data, status=200):
                  raw = json.dumps(data).encode()
                  self.send_response(status)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(raw)))
                  self.send_header("Cache-Control", "no-store")
                  self.end_headers()
                  self.wfile.write(raw)

              def authorized(self):
                  header = self.headers.get("Authorization", "")
                  return secrets.compare_digest(
                      header,
                      "Bearer " + ACCESS_TOKEN
                  )

              def body_json(self):
                  length = int(self.headers.get("Content-Length", "0"))
                  if length > 1024 * 1024:
                      raise ValueError("Request too large")
                  return json.loads(self.rfile.read(length) or b"{}")

              def do_GET(self):
                  path = self.path.split("?", 1)[0]

                  if path == "/":
                      raw = WEB.read_bytes()
                      self.send_response(200)
                      self.send_header("Content-Type", "text/html; charset=utf-8")
                      self.send_header("Content-Length", str(len(raw)))
                      self.end_headers()
                      self.wfile.write(raw)
                      return

                  if path.startswith("/d/"):
                      token = path[3:]
                      with lock:
                          item = links.get(token)

                      if not item or item["expires"] <= time.time():
                          self.send_error(404, "Link expired or invalid")
                          return

                      file_path = item["path"]
                      if not file_path.is_file():
                          self.send_error(404)
                          return

                      self.send_response(200)
                      self.send_header(
                          "Content-Type", "application/octet-stream"
                      )
                      self.send_header(
                          "Content-Disposition",
                          'attachment; filename="' + file_path.name.replace('"', '') + '"'
                      )
                      self.send_header(
                          "Content-Length", str(file_path.stat().st_size)
                      )
                      self.end_headers()

                      with file_path.open("rb") as f:
                          shutil.copyfileobj(f, self.wfile)
                      return

                  if not self.authorized():
                      self.send_json({"error": "Unauthorized"}, 401)
                      return

                  if path == "/api/status":
                      self.send_json({
                          "ok": True,
                          "downloads": len([
                              p for p in DOWNLOADS.iterdir() if p.is_file()
                          ]),
                          "outputs": len([
                              p for p in OUTPUTS.iterdir() if p.is_file()
                          ])
                      })
                      return

                  if path == "/api/files":
                      files = []
                      for folder in (DOWNLOADS, OUTPUTS):
                          for p in folder.iterdir():
                              if p.is_file() and not p.name.endswith(".part"):
                                  files.append({
                                      "name": p.name,
                                      "size": p.stat().st_size,
                                      "location": folder.name
                                  })
                      self.send_json({"files": files})
                      return

                  self.send_error(404)

              def do_POST(self):
                  if not self.authorized():
                      self.send_json({"error": "Unauthorized"}, 401)
                      return

                  try:
                      if self.path == "/api/upload":
                          name = safe_file(
                              self.headers.get("X-Filename", "upload.bin")
                          )
                          length = int(self.headers.get("Content-Length", "0"))

                          if length <= 0 or length > 2 * 1024 * 1024 * 1024:
                              raise ValueError("Invalid upload size")

                          destination = DOWNLOADS / name
                          temp = DOWNLOADS / (name + ".uploading")

                          remaining = length
                          with temp.open("wb") as f:
                              while remaining:
                                  chunk = self.rfile.read(min(1024 * 1024, remaining))
                                  if not chunk:
                                      raise ValueError("Incomplete upload")
                                  f.write(chunk)
                                  remaining -= len(chunk)

                          temp.replace(destination)
                          self.send_json({"ok": True, "name": name})
                          return

                      data = self.body_json()

                      if self.path == "/api/process":
                          name = safe_file(data.get("name", ""))
                          operation = data.get("operation")
                          source = find_file(name)

                          output_name = str(uuid.uuid4())
                          output = OUTPUTS / output_name

                          if operation == "compress":
                              output = output.with_suffix(".mp4")
                              run_ffmpeg([
                                  "-i", str(source),
                                  "-c:v", "libx264",
                                  "-preset", "veryfast",
                                  "-crf", "28",
                                  "-c:a", "aac",
                                  "-b:a", "128k",
                                  str(output)
                              ])

                          elif operation == "mp3":
                              output = output.with_suffix(".mp3")
                              run_ffmpeg([
                                  "-i", str(source),
                                  "-vn",
                                  "-codec:a", "libmp3lame",
                                  "-q:a", "3",
                                  str(output)
                              ])

                          elif operation == "thumbnail":
                              output = output.with_suffix(".jpg")
                              run_ffmpeg([
                                  "-ss", "00:00:03",
                                  "-i", str(source),
                                  "-frames:v", "1",
                                  str(output)
                              ])

                          else:
                              raise ValueError("Unknown operation")

                          if not output.is_file():
                              raise RuntimeError("Output was not created")

                          self.send_json({
                              "ok": True,
                              "name": output.name,
                              "download": issue_link(output),
                              "expires_in_seconds": LINK_TTL
                          })
                          return

                      if self.path == "/api/zip":
                          data = self.body_json()
                          names = data.get("names", [])

                          if not isinstance(names, list) or not names or len(names) > 100:
                              raise ValueError("Select between 1 and 100 files")

                          output = OUTPUTS / (str(uuid.uuid4()) + ".zip")

                          with zipfile.ZipFile(
                              output, "w", zipfile.ZIP_DEFLATED
                          ) as archive:
                              for name in names:
                                  source = find_file(name)
                                  archive.write(source, arcname=source.name)

                          self.send_json({
                              "ok": True,
                              "name": output.name,
                              "download": issue_link(output),
                              "expires_in_seconds": LINK_TTL
                          })
                          return

                      if self.path == "/api/link":
                          data = self.body_json()
                          source = find_file(data.get("name", ""))
                          self.send_json({
                              "download": issue_link(source),
                              "expires_in_seconds": LINK_TTL
                          })
                          return

                      self.send_error(404)

                  except Exception as exc:
                      self.send_json({"error": str(exc)}, 400)

          threading.Thread(target=cleanup, daemon=True).start()

          print("Dashboard server listening on 8080")
          ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
          PY

          cat > index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Cloud Media Studio</title>
          <style>
          *{box-sizing:border-box}
          body{margin:0;background:#0b1020;color:#e8edff;font:15px Arial,sans-serif}
          header{padding:22px 5%;background:#111a31;border-bottom:1px solid #253250}
          header h1{margin:0;font-size:23px}
          header p{color:#91a0c2;margin:7px 0 0}
          main{max-width:1100px;margin:28px auto;padding:0 18px}
          .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
          .card{background:#131d35;border:1px solid #263654;border-radius:14px;padding:19px}
          h2{font-size:17px;margin-top:0}
          button,.button{background:#4269ee;color:white;border:0;border-radius:8px;padding:10px 14px;cursor:pointer;text-decoration:none;display:inline-block}
          button:hover,.button:hover{background:#3154ce}
          input{max-width:100%;background:#0b1428;color:white;border:1px solid #354767;padding:10px;border-radius:8px}
          .muted{color:#9baacb;font-size:13px}
          #files{margin-top:15px}
          .file{padding:12px;margin:8px 0;background:#0c162c;border-radius:8px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
          .file span{flex:1;overflow-wrap:anywhere}
          #message{margin:18px 0;color:#9fbcff;overflow-wrap:anywhere}
          a{color:#a9c0ff}
          </style>
          </head>
          <body>
          <header>
            <h1>Cloud Media Studio</h1>
            <p>Your temporary cloud media workstation</p>
          </header>
          <main>
            <div class="grid">
              <section class="card">
                <h2>Remote Firefox</h2>
                <p class="muted">Open the full Firefox desktop in a separate tab.</p>
                <a class="button" id="browser" target="_blank" rel="noopener">Open Browser</a>
              </section>
              <section class="card">
                <h2>Upload files</h2>
                <input type="file" id="upload">
                <p><button onclick="uploadFile()">Upload</button></p>
              </section>
              <section class="card">
                <h2>Refresh files</h2>
                <p class="muted">View files uploaded here or downloaded inside Firefox.</p>
                <button onclick="loadFiles()">Refresh</button>
              </section>
            </div>

            <p id="message">Enter your access token to connect.</p>

            <section class="card">
              <h2>Files</h2>
              <div id="files"></div>
            </section>
          </main>
          <script>
          const token = localStorage.getItem("cms_token") ||
            prompt("Enter the Studio access token:");
          if(token) localStorage.setItem("cms_token", token);

          const browserUrl = localStorage.getItem("cms_browser");
          if(browserUrl) document.getElementById("browser").href = browserUrl;
          else {
            const value = prompt("Paste the Browser URL from GitHub Actions logs:");
            if(value) {
              localStorage.setItem("cms_browser", value);
              document.getElementById("browser").href = value;
            }
          }

          const headers = {"Authorization":"Bearer "+token};
          const message = text => document.getElementById("message").textContent=text;

          async function api(path, options={}) {
            options.headers = {...(options.headers||{}), ...headers};
            const response = await fetch(path, options);
            const data = await response.json();
            if(!response.ok) throw new Error(data.error || "Request failed");
            return data;
          }

          async function loadFiles() {
            try {
              const data = await api("/api/files");
              const box = document.getElementById("files");
              box.innerHTML = "";
              data.files.forEach(file => {
                const row = document.createElement("div");
                row.className = "file";
                const label = document.createElement("span");
                label.textContent = file.name + " — " +
                  (file.size/1024/1024).toFixed(2) + " MB ("+file.location+")";
                row.appendChild(label);

                ["compress","mp3","thumbnail"].forEach(op => {
                  const button = document.createElement("button");
                  button.textContent = op;
                  button.onclick = () => processFile(file.name, op);
                  row.appendChild(button);
                });

                const linkButton = document.createElement("button");
                linkButton.textContent = "Temporary link";
                linkButton.onclick = () => makeLink(file.name);
                row.appendChild(linkButton);
                box.appendChild(row);
              });
              message(data.files.length + " files found.");
            } catch(e) { message(e.message); }
          }

          async function uploadFile() {
            const file = document.getElementById("upload").files[0];
            if(!file) return message("Choose a file first.");
            try {
              const response = await fetch("/api/upload", {
                method:"POST",
                headers:{
                  ...headers,
                  "X-Filename":encodeURIComponent(file.name),
                  "Content-Length":file.size
                },
                body:file
              });
              const data = await response.json();
              if(!response.ok) throw new Error(data.error || "Upload failed");
              message("Uploaded: "+data.name);
              loadFiles();
            } catch(e) { message(e.message); }
          }

          async function processFile(name, operation) {
            try {
              message("Processing "+name+"...");
              const data = await api("/api/process", {
                method:"POST",
                headers:{"Content-Type":"application/json"},
                body:JSON.stringify({name,operation})
              });
              message("Finished. Download: "+location.origin+data.download+
                " — link expires in 30 minutes.");
            } catch(e) { message(e.message); }
          }

          async function makeLink(name) {
            try {
              const data = await api("/api/link", {
                method:"POST",
                headers:{"Content-Type":"application/json"},
                body:JSON.stringify({name})
              });
              message("Temporary download: "+location.origin+data.download+
                " — expires in 30 minutes.");
            } catch(e) { message(e.message); }
          }

          loadFiles();
          setInterval(loadFiles, 15000);
          </script>
          </body>
          </html>
          HTML

      - name: Configure Firefox profile
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/cloud-media-studio"

          mkdir -p profile/extensions

          curl -fL \
            https://addons.mozilla.org/firefox/downloads/latest/ublock-origin/latest.xpi \
            -o profile/extensions/uBlock0@raymondhill.net.xpi

          cat > profile/user.js <<'EOF'
          user_pref("browser.shell.checkDefaultBrowser", false);
          user_pref("browser.aboutwelcome.enabled", false);
          user_pref("browser.startup.homepage", "https://www.google.com");
          user_pref("browser.download.folderList", 2);
          user_pref("browser.download.dir", "/home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/cloud-media-studio/Downloads");
          user_pref("browser.download.useDownloadDir", true);
          user_pref("browser.download.manager.showWhenStarting", true);
          user_pref("extensions.autoDisableScopes", 0);
          user_pref("extensions.enabledScopes", 15);
          user_pref("toolkit.legacyUserProfileCustomizations.stylesheets", true);
          EOF

      - name: Start desktop and services
        shell: bash
        env:
          STUDIO_TOKEN: ${{ secrets.STUDIO_TOKEN }}
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/cloud-media-studio"

          export DISPLAY=:99

          STUDIO_TOKEN="${STUDIO_TOKEN:-$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')}"
          VNC_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(12))')"

          echo "::add-mask::$STUDIO_TOKEN"
          echo "::add-mask::$VNC_PASSWORD"

          echo "STUDIO_TOKEN=$STUDIO_TOKEN" >> "$GITHUB_ENV"
          echo "VNC_PASSWORD=$VNC_PASSWORD" >> "$GITHUB_ENV"

          echo "======================================"
          echo "DASHBOARD ACCESS TOKEN:"
          echo "$STUDIO_TOKEN"
          echo "VNC PASSWORD:"
          echo "$VNC_PASSWORD"
          echo "======================================"

          Xvfb :99 -screen 0 1440x900x24 -ac &
          sleep 2

          fluxbox &
          sleep 2

          x11vnc -display :99 \
            -forever -shared \
            -rfbauth <(printf '%s\n' "$VNC_PASSWORD" | x11vnc -storepasswd stdin /tmp/vnc.pass >/dev/null 2>&1; echo /tmp/vnc.pass) \
            -rfbport 5900 -localhost &

          sleep 2

          websockify --web=/usr/share/novnc 6080 localhost:5900 \
            > /tmp/novnc.log 2>&1 &

          python3 server.py > /tmp/studio.log 2>&1 &
          echo $! > /tmp/studio.pid

          firefox --no-remote \
            --profile "$GITHUB_WORKSPACE/cloud-media-studio/profile" \
            --kiosk \
            https://www.google.com \
            > /tmp/firefox.log 2>&1 &

          # Install cloudflared
          curl -fL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /tmp/cloudflared
          chmod +x /tmp/cloudflared

          /tmp/cloudflared tunnel --url http://127.0.0.1:8080 \
            > /tmp/dashboard-tunnel.log 2>&1 &
          echo $! > /tmp/dashboard-tunnel.pid

          /tmp/cloudflared tunnel --url http://127.0.0.1:6080 \
            > /tmp/browser-tunnel.log 2>&1 &
          echo $! > /tmp/browser-tunnel.pid

          echo "Waiting for Cloudflare tunnel URLs..."
          for i in $(seq 1 60); do
            DASHBOARD_URL="$(grep -Eo 'https://[-a-zA-Z0-9]+\.trycloudflare\.com' /tmp/dashboard-tunnel.log | head -n1 || true)"
            BROWSER_URL="$(grep -Eo 'https://[-a-zA-Z0-9]+\.trycloudflare\.com' /tmp/browser-tunnel.log | head -n1 || true)"
            if [ -n "$DASHBOARD_URL" ] && [ -n "$BROWSER_URL" ]; then
              break
            fi
            sleep 2
          done

          echo "======================================"
          echo "DASHBOARD: ${DASHBOARD_URL:-NOT READY}"
          echo "BROWSER:   ${BROWSER_URL:-NOT READY}/vnc.html"
          echo "======================================"

          if [ -z "$DASHBOARD_URL" ] || [ -z "$BROWSER_URL" ]; then
            echo "Tunnel startup failed. Logs:"
            cat /tmp/dashboard-tunnel.log || true
            cat /tmp/browser-tunnel.log || true
            exit 1
          fi

          echo "The studio is running. Keep this workflow open."
          echo "Maximum session duration: 4 hours."

          sleep 13800

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          pkill -f 'firefox' || true
          pkill -f 'cloudflared' || true
          pkill -f 'x11vnc' || true
          pkill -f 'websockify' || true
          pkill -f 'Xvfb' || true
          rm -rf "$GITHUB_WORKSPACE/cloud-media-studio/Downloads"
          rm -rf "$GITHUB_WORKSPACE/cloud-media-studio/outputs"
          rm -rf /tmp/vnc.pass
